    <input type="text" id="secondInput">

<script>


    function generate() {
       let firstInput = Number(document.getElementById("firstInput").value);
       let secondInput = Number(document.getElementById("secondInput").value);

    let min = Math.min(firstInput , secondInput);
    let max = Math.max(firstInput , secondInput);

    let randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;

        // console.log(firstInput);
        // console.log(secondInput);
        // console.log(min);
        // console.log(max);
        console.log(randomNumber);
    }
</script>

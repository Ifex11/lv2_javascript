<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        body{
            background-color: aquamarine;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 0 0;
            .calculator{
                display: flex;
                gap: 16px;
                input{
                    outline: none;
                    border: 3px solid grey;
                    border-radius: 20px;
                    font-weight: 600;
                    font-size: 16px;
                }
                div{
                    font-weight: 700;
                    font-size: 18px;
                    border: 5px double grey;
                    height: 40px;
                    width: 40px;
                    border-radius: 50%;
                    background-color: antiquewhite;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }
            }
            .operators{
                margin: 20px 0 0;
                display: flex;
                gap: 8px;
                button{
                    height: 40px;
                    width: 40px;
                    border-radius: 10px;
                    border: 3px solid grey;
                }
                button:active{
                    transform: translateY(2px);
                }
            }
            .screen{
                margin: 12px 0 0;
                font-size: 22px;
                font-weight: 800;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" placeholder="0" id="firstInput">
        <div id="operator"><span id="show">?</span></div>
        <input type="text" placeholder="0" id="secondInput">
    </div>
    <div class="operators">
        <button onclick="divide()">/</button>
        <button id="mul" onclick="multiply()">*</button>
        <button id="add" onclick="add()">+</button>
        <button id="sub" onclick="subtract()">-</button>
        <button id="mod" onclick="modulus()">%</button>
        <button id="pow" onclick="pow()">^</button>
    </div>
    <div class="screen" id="result"></div>
</body>
<script>
    let Firstinput = document.getElementById('firstInput')
    let Secondinput = document.getElementById('secondInput')
    let resultScreen = document.getElementById('result')
    function divide(){
        let num1 = +Firstinput.value;
        let num2 = +Secondinput.value;

        let result = num1 / num2
        resultScreen.innerHTML = result
        show.innerHTML = '/'
    }
    function multiply(){
        let num1 = +Firstinput.value;
        let num2 = +Secondinput.value;

        let result = num1 * num2
        resultScreen.innerHTML = result
        show.innerHTML = 'x'
    }
    function add(){
        let num1 = +Firstinput.value;
        let num2 = +Secondinput.value;

        let result = num1 + num2
        resultScreen.innerHTML = result
        show.innerHTML = '+'
    }
    function subtract(){
        let num1 = +Firstinput.value;
        let num2 = +Secondinput.value;

        let result = num1 - num2
        resultScreen.innerHTML = result
        show.innerHTML = '-'
    }
    function modulus(){
        let num1 = +Firstinput.value;
        let num2 = +Secondinput.value;

        let result = num1 % num2
        resultScreen.innerHTML = result
        show.innerHTML = '%'
    }
    function pow(){
        let num1 = +Firstinput.value;
        let num2 = +Secondinput.value;

        let result = num1 ** num2
        resultScreen.innerHTML = result
        show.innerHTML = '^'
    }
</script>
</html>
